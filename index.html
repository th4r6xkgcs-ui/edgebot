<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EdgeBot">
<meta name="description" content="Sports picks that learn from every final.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>EdgeBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; HQ tab hosts a 3D ops floor. Dark-first by design (night trading floor). */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#0B1020; --panel:#121A2E; --panel2:#18223B; --line:#24314F; --fg:#E9EDF7; --muted:#8F9BB7;
  --amber:#FFB547; --mint:#47DFAE; --coral:#FF6F61; --violet:#8F80FF; --sky:#5CC8FF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 i{font-style:normal;color:var(--amber)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--mint);box-shadow:0 0 8px var(--mint)}.dot.warn{background:var(--amber)}
.logo{width:40px;height:40px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.t-Strong{background:rgba(71,223,174,.16);color:var(--mint)}.t-Value{background:rgba(255,181,71,.16);color:var(--amber)}.t-Lean{background:rgba(143,155,183,.16);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-family:var(--mono);font-weight:500;margin-left:4px;opacity:.7}
h2.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 14px 12px;width:100%;text-align:left;background:transparent;border:0}
.pick .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.pick .main{all:unset;cursor:pointer;min-width:0;display:block}
.pick .main:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.pick strong{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.pick .mu{color:var(--muted);font-size:13.5px}
.pick .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pick .pct{font-family:var(--mono);font-size:22px;font-weight:700}
.pick .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel2);position:relative;overflow:hidden;margin-top:4px}
.pick .bar i{position:absolute;inset:0 auto 0 0;background:var(--muted);opacity:.5}
.pick .bar u{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.pick .foot{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pick .foot em{font-style:normal;color:var(--fg)}
.reason{grid-column:1/-1;margin:2px 0 0;font-size:13.5px;color:var(--fg);opacity:.85;line-height:1.35}
.ctx{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.ctx span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.clv-good{color:var(--mint)}.clv-bad{color:var(--coral)}
.feat{border-color:rgba(255,181,71,.45);background:linear-gradient(160deg,rgba(255,181,71,.10),var(--panel) 55%)}
.star{border:0;background:transparent;width:44px;height:44px;margin:-8px -8px 0 0;color:var(--muted);font-size:20px}
.star[aria-pressed="true"]{color:var(--amber)}
.game{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.game time{font-size:12px;color:var(--muted)}
.game .tm{display:flex;flex-direction:column;gap:2px;min-width:0}
.game .tm span{display:flex;justify-content:space-between;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .tm small{color:var(--muted);font-weight:500}
.game .wp{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
.game .wp b{display:block;color:var(--fg);font-size:15px}
.empty{padding:22px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:19px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);padding:2px 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,16,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--amber)}
nav.tabs svg{width:24px;height:24px}
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,14,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:88%;overflow:auto;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-size:24px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sheet .close{float:right;border:0;background:var(--panel2);border-radius:999px;width:36px;height:36px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;margin:10px 0}
.kv div{display:contents}
.kv span,.kv b{padding:9px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)}.kv b{font-family:var(--mono);font-weight:700;text-align:right}
.why{margin:8px 0 0;padding-left:18px;color:var(--fg)}.why li{margin:4px 0}
.dist{display:flex;align-items:flex-end;gap:2px;height:84px;margin:10px 0 2px}
.dist i{flex:1;background:var(--violet);border-radius:2px 2px 0 0;opacity:.8;min-width:2px}
.dist i.z{background:var(--amber);opacity:1}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.check{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.check label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.check input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;font:500 16px var(--mono);width:100%;min-width:0}
.res{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.W{color:var(--mint)}.L{color:var(--coral)}.P{color:var(--muted)}
table.lanes{width:100%;border-collapse:collapse;font-size:13.5px}
table.lanes th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 6px}
table.lanes td{padding:9px 6px;border-top:1px solid var(--line)}
table.lanes td.n{font-family:var(--mono);text-align:right}
.scroll-x{overflow-x:auto}
.st-PROVEN{color:var(--mint)}.st-STRUGGLING{color:var(--coral)}.st-BUILDING{color:var(--muted)}
#hq-canvas{width:100%;aspect-ratio:4/3;max-height:58vh;display:block;border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#1a2547,#0B1020 70%);border:1px solid var(--line);touch-action:none}
.hq-hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.agent b{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px}
.agent b i{width:9px;height:9px;border-radius:50%;display:inline-block}
.agent p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed time{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:26px 8px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="11" fill="#121A2E" stroke="#24314F"/><path d="M9 27 L16 20 L21 24 L31 12" fill="none" stroke="#FFB547" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="12" r="3.3" fill="#47DFAE"/></svg>
      <div><h1>Edge<i>Bot</i></h1><div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div></div>
    </div>
  </header>
  <main id="view"></main>
  <p class="disclaimer">Research picks with a tracked record. No bets are placed. Not a guarantee — bet only what you can afford to lose.</p>
</div>
<nav class="tabs" aria-label="Main">
  <button data-tab="picks" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Picks</button>
  <button data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/></svg>Games</button>
  <button data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>Record</button>
  <button data-tab="hq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>HQ</button>
</nav>
<div id="sheet-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="engine.js"></script>
<script>
(() => {
const E = window.EdgeEngine, SP = E.SPORTS;
const state = { tab: "picks", sport: "ALL", day: "upcoming", slate: null, model: null, ledger: [], runs: [], db: null, error: "", saved: loadSaved(), now: Date.now() };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p) => p == null ? "—" : Math.round(p * 100) + "%";
const pct1 = (p) => p == null ? "—" : (p * 100).toFixed(1) + "%";
const am = (x) => x == null ? "—" : x > 0 ? "+" + x : String(x);
const sgn = (x, d = 1) => (x > 0 ? "+" : "") + x.toFixed(d);
function loadSaved() { try { return JSON.parse(localStorage.getItem("edgebot2-saved") || "[]"); } catch { return []; } }
function saveSaved() { try { localStorage.setItem("edgebot2-saved", JSON.stringify(state.saved.slice(-300))); } catch {} }
function when(iso) {
  const d = new Date(iso), now = new Date(), t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(d) - day(now)) / 864e5);
  return diff === 0 ? t : diff === 1 ? "Tmrw " + t : diff === -1 ? "Yest " + t : d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + " " + t;
}
function ago(iso) { if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 6e4); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
const sportLabel = (s) => SP[s]?.label || s;

/* ------------------------------ data ------------------------------ */
const DATA_URL = "https://raw.githubusercontent.com/th4r6xkgcs-ui/edgebot/data/app.json";
async function connect() {
  const load = async () => {
    try {
      let r = await fetch(DATA_URL + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      if (!r.ok) r = await fetch("data/app.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("The first update hasn’t finished yet. Check back in a few minutes.");
      const d = await r.json();
      state.slate = d.slate; state.model = d.model; state.ledger = d.ledger || []; state.runs = d.runs || []; state.error = "";
      simCache.clear(); render(); if (hq.ready) hq.update();
    } catch (e) { state.error = navigator.onLine === false ? "You’re offline. Showing the last loaded picks." : e.message; if (!state.slate) render(); }
  };
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
const games = () => (state.slate?.games || []);
function predOf(g) { return g.pred ? { ...g.pred } : null; }
const simCache = new Map();
function sim(g) {
  const p = predOf(g); if (!p) return null;
  const k = g.id + "|" + p.margin + "|" + p.total + "|" + g.spread + "|" + g.total;
  if (!simCache.has(k)) simCache.set(k, E.simulate(g, p, 10000));
  return simCache.get(k);
}
function currentPicks() {
  const now = Date.now();
  return games().filter((g) => g.pick && Date.parse(g.start) > now - 3 * 3600e3)
    .map((g) => ({ g, p: g.pick, id: `${g.id}~${g.pick.market}~${g.pick.side}` }))
    .sort((a, b) => b.p.ev - a.p.ev);
}
function leans() {
  const now = Date.now();
  return games().filter((g) => !g.pick && g.pred && g.status === "pre" && Date.parse(g.start) > now)
    .map((g) => { const home = g.pred.pHome >= g.pred.pAway; return { g, side: home ? g.home : g.away, p: home ? g.pred.pHome : g.pred.pAway }; })
    .filter((x) => x.p >= 0.6).sort((a, b) => b.p - a.p);
}

/* ------------------------------ views ------------------------------ */
function sportChips(list, key = "sport") {
  const counts = {}; for (const x of list) counts[x] = (counts[x] || 0) + 1;
  const sports = Object.keys(SP).filter((s) => counts[s]);
  return `<div class="chips" role="group" aria-label="Sport">${["ALL", ...sports, ...(key === "sport" ? ["SAVED"] : [])].map((s) =>
    `<button class="chip" data-${key}="${s}" aria-pressed="${state.sport === s}">${s === "ALL" ? "All" : s === "SAVED" ? "★ Saved" : sportLabel(s)}${s !== "ALL" && s !== "SAVED" ? `<b>${counts[s]}</b>` : ""}</button>`).join("")}</div>`;
}
/** The one line that best explains a pick: a tested situational effect first, then the rating view. */
function topReason(g) {
  const w = g.why || [];
  return w.find((x) => /rest|wind|back-to-back/i.test(x)) || w.find((x) => /^EdgeBot ratings/.test(x)) || "";
}
function contextChips(g) {
  const c = [];
  if (g.restDays && g.restDays.home != null && g.restDays.away != null) c.push(`Rest ${g.away.abbr} ${g.restDays.away}d · ${g.home.abbr} ${g.restDays.home}d`);
  if (g.weather) c.push(g.weather.outdoor ? `Wind ${Math.round(g.weather.windMph ?? 0)} mph${g.weather.tempF != null ? ` · ${Math.round(g.weather.tempF)}°F` : ""}` : `Roof: ${g.weather.roof}`);
  const inj = g.injuries; if (inj) { const n = (x) => (x || []).filter((p) => p.status === "OUT" || p.status === "DOUBTFUL").length; if (n(inj.away) + n(inj.home)) c.push(`Out/doubtful: ${g.away.abbr} ${n(inj.away)} · ${g.home.abbr} ${n(inj.home)}`); }
  return c;
}
function pickCard({ g, p, id }, feat) {
  const saved = state.saved.includes(id), s = sim(g);
  return `<article class="card ${feat ? "feat" : ""}"><div class="pick">
    <div class="meta"><span>${esc(sportLabel(g.sport))} · ${esc(p.market)} · ${esc(when(g.start))}</span>
      <button class="star" data-save="${esc(id)}" aria-pressed="${saved}" aria-label="${saved ? "Unsave" : "Save"} pick">${saved ? "★" : "☆"}</button></div>
    <button class="main" data-game="${esc(g.id)}">
      <strong>${esc(p.label)} <span class="num" style="font-size:15px;color:var(--muted);font-weight:500">${am(p.price)}</span></strong>
      <span class="mu">${esc(g.away.name)} @ ${esc(g.home.name)}</span></button>
    <div class="right"><span class="pill t-${p.tier}">${p.tier}</span><span class="pct">${pct(p.p)}</span></div>
    <div class="bar" aria-hidden="true"><u style="width:${(p.p * 100).toFixed(1)}%"></u><i style="width:${(p.pMkt * 100).toFixed(1)}%"></i></div>
    ${topReason(g) ? `<p class="reason">${esc(topReason(g))}</p>` : ""}
    <div class="foot"><span>Market <em class="num">${pct(p.pMkt)}</em></span><span>Edge <em class="num">${sgn(p.edge * 100)}%</em></span><span>Fair <em class="num">${am(p.fair)}</em></span>${s && p.market !== "moneyline" ? `<span>Sim hits <em class="num">${pct(p.market === "total" ? (p.side === "over" ? s.over : s.under) / (s.over + s.under) : (p.side === "home" ? s.cover : 1 - s.cover - s.push) / (1 - s.push))}</em></span>` : ""}</div>
  </div></article>`;
}
function viewPicks() {
  if (!state.slate) return loadingOrError();
  let picks = currentPicks();
  const allSports = picks.map((x) => x.g.sport);
  if (state.sport === "SAVED") picks = picks.filter((x) => state.saved.includes(x.id));
  else if (state.sport !== "ALL") picks = picks.filter((x) => x.g.sport === state.sport);
  const best = picks.filter((x) => x.p.tier !== "Lean").slice(0, 3), rest = picks.filter((x) => !best.includes(x));

    ${!picks.length ? `<div class="card empty"><strong>${state.sport === "SAVED" ? "No saved picks" : "No edges right now"}</strong>${state.sport === "SAVED" ? "Tap ☆ on a pick to keep it here." : "EdgeBot only makes a pick when its ratings disagree with the price. Ratings are learning from every final — picks appear as they firm up. Leans below are the model’s favorites without an edge."}</div>` : ""}
    ${L.length ? `<h2 class="sec"><span>Leans · no price edge, not tracked</span><span>${L.length}</span></h2><div class="card">${L.slice(0, 12).map((x) => gameRow(x.g)).join("")}</div>` : ""}`;
}
function gameRow(g) {

function viewGames() {

function viewRecord() {
  if (!state.slate && !state.model) return loadingOrError();
  const L = state.ledger, g = L.filter((r) => r.status === "graded"), dec = g.filter((r) => r.result !== "P");
  const w = dec.filter((r) => r.result === "W").length, units = g.reduce((a, r) => a + (r.units || 0), 0);
  const by = (key) => { const m = {}; for (const r of g) { const k = key(r); (m[k] ||= { w: 0, l: 0, p: 0, u: 0 }); r.result === "W" ? m[k].w++ : r.result === "L" ? m[k].l++ : m[k].p++; m[k].u += r.units || 0; } return m; };
  const tiers = by((r) => r.tier), lanes = state.model?.lanes || {}, blend = state.model?.blend || {};
  const withClv = L.filter((r) => r.clv), beat = withClv.filter((r) => (r.clv.pts ?? 0) > 0 || (r.clv.prob ?? 0) > 0.002).length, lost = withClv.filter((r) => (r.clv.pts ?? 0) < 0 || (r.clv.prob ?? 0) < -0.002).length;
  const avgPts = (() => { const xs = withClv.filter((r) => r.clv.pts != null).map((r) => r.clv.pts); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; })();

  const laneRows = Object.entries(lanes).map(([k, v]) => { const st = E.laneState(v); return `<tr><td>${esc(k.replace("|", " · "))}</td><td class="n">${v.w}–${v.l}</td><td class="n">${v.n ? (v.brier / v.n).toFixed(3) : "—"}</td><td class="st-${st}">${st === "PROVEN" ? "Working" : st === "STRUGGLING" ? "Struggling" : "Building"}</td></tr>`; }).join("");

      <div class="stat"><b class="num">${w}–${dec.length - w}</b><span>all-time${g.length - dec.length ? ` · ${g.length - dec.length} push` : ""}${voids ? ` · ${voids} void` : ""}</span></div>
      <div class="stat"><b class="num">${dec.length ? Math.round(100 * w / dec.length) + "%" : "—"}</b><span>win rate</span></div>
      <div class="stat"><b class="num" style="color:${units >= 0 ? "var(--mint)" : "var(--coral)"}">${sgn(units)}u</b><span>${g.length ? `ROI ${sgn(100 * units / g.length)}%` : "no graded picks yet"}</span></div></div>
    <h2 class="sec"><span>Beat the closing line?</span><span>${withClv.length} checked</span></h2>
    <div class="card" style="padding:14px">${withClv.length ? `<div class="kv" style="margin:0">
      <div><span>Got a better number than the close</span><b class="${beat >= lost ? "clv-good" : "clv-bad"}">${beat} of ${withClv.length} (${Math.round(100 * beat / withClv.length)}%)</b></div>
      ${avgPts != null ? `<div><span>Average line value (spreads & totals)</span><b class="${avgPts >= 0 ? "clv-good" : "clv-bad"}">${sgn(avgPts, 2)} pts</b></div>` : ""}
      ${avgProb != null ? `<div><span>Average price value (moneylines)</span><b class="${avgProb >= 0 ? "clv-good" : "clv-bad"}">${sgn(avgProb * 100, 1)}%</b></div>` : ""}
    </div>` : ""}<p class="note" style="margin:${withClv.length ? "10px" : "0"} 0 0">Closing-line value is the earliest honest test of an edge: if the market keeps moving toward EdgeBot’s picks before kickoff, the picks are likely sharp — long before wins and losses settle it.</p></div>
    <h2 class="sec"><span>By strength</span></h2>

/* ------------------------------ sheet ------------------------------ */
function openGame(id) {
  const g = games().find((x) => x.id === id); if (!g) return;
  const p = g.pred, s = g.status !== "post" ? sim(g) : null, pk = g.pick;
  let distHtml = "";
  if (s && p) {
    const S = SP[g.sport], lo = Math.floor(p.margin - 2.5 * S.sdM), hi = Math.ceil(p.margin + 2.5 * S.sdM), bins = 30, w = (hi - lo) / bins;
    const h = new Array(bins).fill(0), sd = S.sdM;

  }
  const html = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(g.away.name)} at ${esc(g.home.name)}">
    <div class="grab"></div><button class="close" data-close="1" aria-label="Close">✕</button>
    <span class="note">${esc(sportLabel(g.sport))} · ${esc(when(g.start))}</span>
    <h3>${esc(g.away.name)} @ ${esc(g.home.name)}</h3>
    ${g.status === "post" ? `<p class="res">Final: ${esc(g.away.abbr)} ${g.away.score} – ${esc(g.home.abbr)} ${g.home.score}</p>` : ""}
    ${pk ? `<p class="res"><span class="pill t-${pk.tier}">${pk.tier}</span> <b>${esc(pk.label)}</b> <span class="num">${am(pk.price)}</span> — EdgeBot ${pct1(pk.p)} vs ${pct1(pk.pMkt)} priced in · fair ${am(pk.fair)} · EV ${sgn(pk.ev * 100)}%</p>` : ""}
    ${p ? `<div class="kv">
      <div><span>Projected score</span><b>${esc(g.away.abbr)} ${s ? s.muA.toFixed(1) : "—"} – ${esc(g.home.abbr)} ${s ? s.muH.toFixed(1) : "—"}</b></div>
      <div><span>${esc(g.home.abbr)} wins (simulated)</span><b>${pct1(s ? s.home : p.pHome)}</b></div>
      <div><span>${esc(g.away.abbr)} wins (simulated)</span><b>${pct1(s ? s.away : p.pAway)}</b></div>
      ${s && s.draw > 0.001 ? `<div><span>Draw</span><b>${pct1(s.draw)}</b></div>` : ""}
      ${g.spread != null && s ? `<div><span>${esc(g.home.abbr)} ${g.spread > 0 ? "+" : ""}${g.spread} covers</span><b>${pct1(s.cover)}${s.push > 0.005 ? ` · push ${pct1(s.push)}` : ""}</b></div>` : ""}
      ${g.total != null && s ? `<div><span>Over ${g.total}</span><b>${pct1(s.over)}</b></div>` : ""}
      ${s ? `<div><span>Margin range (80%)</span><b>${s.range[0]} to ${s.range[2] > 0 ? "+" : ""}${s.range[2]}</b></div>` : ""}
      ${s ? `<div><span>Most likely scores</span><b>${s.top.slice(0, 3).map((t) => t.s.split("-").reverse().join("–") + " " + pct1(t.p)).join(" · ")}</b></div>` : ""}

/* ------------------------------ render ------------------------------ */
function setTabs() { document.querySelectorAll("nav.tabs button").forEach((b) => b.dataset.tab === state.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")); }
function render() {
  const m = state.model, fresh = m?.lastRun && Date.now() - Date.parse(m.lastRun) < 8 * 3600e3;
  $("#dot").className = "dot " + (fresh ? "ok" : m ? "warn" : "");
  $("#status").textContent = m ? `Updated ${ago(m.lastRun)} · ${m.runs} runs` : state.slate ? "Waiting for first run" : "Connecting…";
  const views = { picks: viewPicks, games: viewGames, record: viewRecord, hq: viewHQ };

  if (state.tab === "hq" && hadCanvas && hq.ready) {

document.addEventListener("click", (e) => {

  if (t.dataset.tab) { state.tab = t.dataset.tab; setTabs(); window.scrollTo({ top: 0 }); render(); return; }
  if (t.dataset.sport || t.dataset.sport2) { state.sport = t.dataset.sport || t.dataset.sport2; render(); return; }
  if (t.dataset.day) { state.day = t.dataset.day; render(); return; }
  if (t.dataset.save) { const id = t.dataset.save; state.saved = state.saved.includes(id) ? state.saved.filter((x) => x !== id) : [...state.saved, id]; saveSaved(); render(); return; }
  if (t.dataset.game) { openGame(t.dataset.game); return; }
  if (t.dataset.close && (e.target === t || t.classList.contains("close"))) { $("#sheet-root").innerHTML = ""; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#sheet-root").innerHTML = ""; });

/* ------------------------------ 3D HQ ------------------------------ */
const hq = (() => {
  let renderer, scene, camera, raf = 0, core, desks = [], bots = [], canvas, angle = 0.6, drag = null, tilt = 0.5, ready = false, last = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = { NBA: 0xff8a3d, NFL: 0x47dfae, NCAAF: 0x8f80ff, NHL: 0x5cc8ff, MLB: 0xff6f61, EPL: 0xffd166 };
  function screenTex(label, n, color) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 160; const x = c.getContext("2d");
    x.fillStyle = "#0b1020"; x.fillRect(0, 0, 256, 160); x.fillStyle = "#" + color.toString(16).padStart(6, "0");
    x.font = "700 30px sans-serif"; x.fillText(label, 16, 44); x.font = "700 64px monospace"; x.fillText(String(n), 16, 120);
    x.font = "500 20px sans-serif"; x.fillStyle = "#8f9bb7"; x.fillText(n === 1 ? "pick" : "picks", 16 + 40 * String(n).length + 8, 118);
    const t = new THREE.CanvasTexture(c); return t;
  }
  function build() {

    const key = new THREE.PointLight(0xffb547, 1.4, 20); key.position.set(0, 4, 0); scene.add(key);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshStandardMaterial({ color: 0x121a2e, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
    const grid = new THREE.PolarGridHelper(9, 12, 6, 64, 0x24314f, 0x1a2440); scene.add(grid);
