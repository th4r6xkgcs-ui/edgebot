<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EdgeBot">
<meta name="description" content="Sports picks that learn from every final.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>EdgeBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Night broadcast desk: deep ink canvas, team colours as the only loud colour, amber for EdgeBot's own voice. Dark by design. */
:root{
  --bg:#090D1A; --bg2:#0D1324; --panel:#111A2F; --panel2:#17213A; --line:#223050; --line2:#2C3B5E;
  --fg:#EEF1F8; --muted:#8C98B4; --dim:#5E6A86;
  --amber:#FFB547; --amber2:#FFCF85; --mint:#45E0AE; --coral:#FF6F61; --violet:#8F80FF; --sky:#5CC8FF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  color-scheme:dark; padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,rgba(143,128,255,.13),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(255,181,71,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{text-wrap:balance}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(9,13,26,.86);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(34,48,80,.6);margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;flex:none;filter:drop-shadow(0 6px 18px rgba(255,181,71,.25))}
.brand h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 i{font-style:normal;color:var(--amber)}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;letter-spacing:.01em}
.live{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(17,26,47,.7);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--mint);box-shadow:0 0 0 3px rgba(69,224,174,.18);animation:pulse 2.4s ease-in-out infinite}
.dot.warn{background:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(69,224,174,0)}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px 18px 16px;border:1px solid var(--line);background:linear-gradient(135deg,#16213D 0%,#111A2F 55%,#1B1733 100%)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.22),transparent 65%);pointer-events:none}
.hero .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber2);font-weight:700}
.hero h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.08;margin:6px 0 12px;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.kpi{min-width:0}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05}
.kpi span{font-size:12px;color:var(--muted)}
.good{color:var(--mint)}.bad{color:var(--coral)}

/* controls */
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 10px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;min-height:40px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 14px rgba(0,0,0,.25)}
.seg button b{font-family:var(--mono);font-weight:500;font-size:12px;margin-left:5px;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(17,26,47,.6);border-radius:999px;padding:7px 13px;min-height:38px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-family:var(--mono);font-weight:500;font-size:12px;opacity:.65}
h2.sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--dim)}

/* team marks */
.tlogo{width:26px;height:26px;flex:none;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.04)}
.tlogo.big{width:54px;height:54px}
.tmono{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--mono);color:#fff;letter-spacing:-.02em}
.tmono.big{width:54px;height:54px;font-size:15px}

/* pick card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;position:relative}
.pick{--tc:var(--amber);animation:rise .35s ease both}
.pick::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tc);opacity:.9}
.pick.feat{border-color:rgba(255,181,71,.45);background:linear-gradient(160deg,rgba(255,181,71,.09),var(--panel) 50%)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pick-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 0 18px;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.02em}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.star{border:0;background:transparent;width:40px;height:40px;color:var(--dim);font-size:19px;border-radius:12px}
.star[aria-pressed="true"]{color:var(--amber)}
.pick-main{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:4px 16px 0 18px;width:100%;box-sizing:border-box}
.pick-main:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;border-radius:var(--r-lg)}
.pick-head{min-width:0}
.pick-head strong{display:block;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.015em}
.pick-head strong .num{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.teams{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.team{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;color:var(--muted)}
.team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-left:auto;padding-left:6px}
.team.on{color:var(--fg);font-weight:600}
.ring{position:relative;width:76px;height:76px;align-self:center}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font:700 19px var(--mono)}
.ring .v small{display:block;font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.tier{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.t-Strong{background:rgba(69,224,174,.15);color:var(--mint)}.t-Value{background:rgba(255,181,71,.15);color:var(--amber)}.t-Lean{background:rgba(140,152,180,.14);color:var(--muted)}
.reason{margin:12px 16px 0 18px;font-size:13.5px;line-height:1.4;color:#C9D1E4;padding:9px 11px;border-radius:var(--r-sm);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:12px 0 0;border-top:1px solid var(--line)}
.stats div{padding:9px 6px 11px;text-align:center;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stats b{font:700 14px var(--mono)}

/* games list */
.game{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.game .side{display:flex;flex-direction:column;gap:7px;min-width:0}
.game .meta2{font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.game .meta2 .tier{padding:1px 8px;font-size:10.5px}
.game .sc{font:700 15px var(--mono);margin-left:auto;padding-left:8px;color:var(--fg)}
.wp{display:flex;flex-direction:column;gap:5px;align-items:stretch;font:600 12px var(--mono);color:var(--muted)}
.wp .bar2{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.wp .bar2 i{display:block;height:100%}
.wp .lbl{display:flex;justify-content:space-between}
.day-h{font-size:12px;font-weight:700;color:var(--muted);padding:10px 14px 6px;background:rgba(255,255,255,.02);border-top:1px solid var(--line);letter-spacing:.03em}
.day-h:first-child{border-top:0}

.empty{padding:26px 20px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:20px;margin-bottom:6px}
.note{font-size:13px;color:var(--muted);padding:2px 4px;margin:6px 0}

/* tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:repeat(4,1fr);width:min(440px,calc(100% - 24px));background:rgba(17,26,47,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);border-radius:22px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:11px;font-weight:600;color:var(--muted);border-radius:16px}
nav.tabs button[aria-current="page"]{color:var(--bg);background:var(--amber)}
nav.tabs svg{width:22px;height:22px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,14,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:720px;max-height:92%;overflow:auto;padding:0 0 calc(28px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.banner{position:relative;padding:12px max(18px,env(safe-area-inset-left,0px)) 18px;background:linear-gradient(110deg,var(--ca) 0%,rgba(13,19,36,.2) 46%,rgba(13,19,36,.2) 54%,var(--ch) 100%)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,19,36,.35),var(--bg2));pointer-events:none}
.banner>*{position:relative;z-index:1}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 10px}
.close{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;border:0;background:rgba(9,13,26,.6);border-radius:999px;width:38px;height:38px;z-index:2}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin-top:6px}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .t b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.1}
.vs .t small{color:var(--muted);font-size:12px}
.vs .mid{font:700 13px var(--mono);color:var(--muted)}
.vs .mid big{display:block;font-family:var(--display);font-size:30px;color:var(--fg);letter-spacing:-.02em}
.sheet-body{padding:0 max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-right,0px))}
.callout{border-radius:var(--r-md);padding:12px 14px;background:linear-gradient(135deg,rgba(255,181,71,.13),rgba(255,181,71,.04));border:1px solid rgba(255,181,71,.3);font-size:14px;margin-top:4px}
.callout b{font-family:var(--display);font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;min-width:0}
.tile span{display:block;font-size:11.5px;color:var(--muted)}
.tile b{font:700 18px var(--mono)}
.tile small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.probbar{margin-top:14px}
.probbar .bar2{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.probbar .bar2 i{display:block}
.probbar .lbl{display:flex;justify-content:space-between;font:600 12.5px var(--mono);margin-top:6px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.ctx{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.ctx span{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;color:#C9D1E4}
.why{margin:6px 0 0;padding-left:18px}.why li{margin:6px 0;font-size:14px}
.inj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inj div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;min-width:0;font-size:13px}
.inj b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.inj p{margin:3px 0;display:flex;justify-content:space-between;gap:6px}
.inj p span:last-child{font:600 11px var(--mono);color:var(--coral)}
.check{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.check label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.check input{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:11px 10px;font:500 16px var(--mono);width:100%;min-width:0}
.res{font-size:14px;margin-top:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line)}
.W{color:var(--mint)}.L{color:var(--coral)}.P{color:var(--muted)}

/* record */
.spark{width:100%;height:120px;display:block}
table.lanes{width:100%;border-collapse:collapse;font-size:13.5px}
table.lanes th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:700;padding:10px 12px}
table.lanes td{padding:10px 12px;border-top:1px solid var(--line)}
table.lanes td.n{font-family:var(--mono);text-align:right}
table.lanes th.n{text-align:right}
.scroll-x{overflow-x:auto}
.st-PROVEN{color:var(--mint)}.st-STRUGGLING{color:var(--coral)}.st-BUILDING{color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--amber))}
.result{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.result:first-child{border-top:0}
.result .what{min-width:0}
.result .what b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .what small{color:var(--muted);font-size:12px}
.result .out{text-align:right;font:700 13px var(--mono)}
.result .out small{display:block;font-weight:500;color:var(--muted)}

/* HQ */
#hq-canvas{width:100%;aspect-ratio:4/3;max-height:60vh;display:block;border-radius:var(--r-lg);background:radial-gradient(ellipse at 50% 35%,#1d2a52,#090D1A 72%);border:1px solid var(--line);touch-action:none}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;min-width:0}
.agent b{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:7px}
.agent b i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 10px currentColor}
.agent p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed time{display:block;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.disclaimer{font-size:12px;color:var(--dim);text-align:center;margin:28px 8px 8px}
.skel{height:150px;border-radius:var(--r-lg);margin-bottom:12px;background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.move{display:inline-flex;align-items:center;gap:6px;margin:10px 16px 0 18px;font:600 12px var(--mono);color:#C9D1E4;padding:5px 10px;border-radius:999px;background:rgba(92,200,255,.08);border:1px solid rgba(92,200,255,.25)}
.move.with{background:rgba(69,224,174,.08);border-color:rgba(69,224,174,.3);color:var(--mint)}
.move.against{background:rgba(255,111,97,.08);border-color:rgba(255,111,97,.3);color:var(--coral)}
.livebadge{display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--mono);color:var(--coral);letter-spacing:.06em}
.livebadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.power{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 48px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.power:first-child{border-top:0}
.power .rk{font:700 13px var(--mono);color:var(--dim);text-align:right}
.power .nm{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.power .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.power .nm small{color:var(--dim);font-weight:500;font-size:11.5px;margin-left:4px}
.power .bar3{height:8px;border-radius:5px;background:var(--panel2);position:relative;overflow:hidden}
.power .bar3 i{position:absolute;top:0;bottom:0}
.power .val{font:700 13px var(--mono);text-align:right}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line2);background:var(--panel);border-radius:14px;min-height:46px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.tip{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:var(--r-md);border:1px solid rgba(92,200,255,.35);background:linear-gradient(135deg,rgba(92,200,255,.14),rgba(92,200,255,.03));margin-bottom:12px}
.tip img{width:40px;height:40px;border-radius:10px;flex:none}
.tip div{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.tip button{border:0;background:transparent;width:40px;height:40px;color:var(--muted)}
.crowd-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.crowd-row:first-child{border-top:0}
.money{font:700 15px var(--mono)}
.money small{display:block;font:500 11px var(--body);color:var(--muted)}
.vsbook{display:inline-flex;gap:5px;align-items:center;font:600 11.5px var(--mono);border-radius:999px;padding:2px 8px;background:rgba(143,128,255,.12);color:#C4BBFF;border:1px solid rgba(143,128,255,.3)}
.src{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-child{border-top:0}
.src b{font-weight:700}
.src .bar2{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.src .bar2 i{display:block}
.src span:last-child{text-align:right;font:600 12px var(--mono);color:var(--muted)}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:2px 14px;margin-bottom:10px}
details.how summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.how summary::after{content:"+";color:var(--muted);font-weight:500}
details.how[open] summary::after{content:"−"}
details.how p,details.how li{font-size:13.5px;color:#C9D1E4;margin:6px 0}
details.how ol{padding-left:18px;margin:0 0 12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2647"/><stop offset="1" stop-color="#111A2F"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="12" fill="url(#lg)" stroke="#2C3B5E"/><path d="M9 27 L16 20 L21 24 L31 12" fill="none" stroke="#FFB547" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="12" r="3.4" fill="#45E0AE"/></svg>
      <div><h1>Edge<i>Bot</i></h1><small id="today"></small></div>
    </div>
    <span class="live"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
  </header>
  <main id="view"></main>
  <p class="disclaimer">Research picks with a tracked, public record. EdgeBot never places bets and nothing here is a guarantee. Bet only what you can afford to lose.</p>
</div>
<nav class="tabs" aria-label="Main">
  <button data-tab="picks" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"/><circle cx="20" cy="7" r="1.6" fill="currentColor"/></svg>Picks</button>
  <button data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14M3 12h4M17 12h4"/></svg>Games</button>
  <button data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>Record</button>
  <button data-tab="hq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>HQ</button>
</nav>
<div id="sheet-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="engine.js"></script>
<script>
(() => {
const E = window.EdgeEngine, SP = E.SPORTS;
const state = { tab: "picks", sport: "ALL", when: "all", day: "upcoming", slate: null, model: null, ledger: [], runs: [], error: "", saved: loadSaved() };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p) => p == null || !isFinite(p) ? "—" : Math.round(p * 100) + "%";
const pct1 = (p) => p == null || !isFinite(p) ? "—" : (p * 100).toFixed(1) + "%";
const am = (x) => x == null ? "—" : x > 0 ? "+" + x : String(x);
const sgn = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
function loadSaved() { try { return JSON.parse(localStorage.getItem("edgebot2-saved") || "[]"); } catch { return []; } }
function saveSaved() { try { localStorage.setItem("edgebot2-saved", JSON.stringify(state.saved.slice(-300))); } catch {} }
const dayKey = (d) => new Date(d).toLocaleDateString("en-CA");
function dayLabel(iso) {
  const d = new Date(iso), t = new Date(), diff = Math.round((new Date(dayKey(d)) - new Date(dayKey(t))) / 864e5);
  return diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
function when(iso) { const l = dayLabel(iso); return (l === "Today" ? "" : l.replace(/,.*$/, "").replace(/^(\w{3})\w+/, "$1") + " ") + timeOf(iso); }
function ago(iso) { if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 6e4); return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; }
const sportLabel = (s) => SP[s]?.label || s;
const SPORT_DOT = { NBA: "#FF8A3D", NFL: "#45E0AE", NCAAF: "#8F80FF", NHL: "#5CC8FF", MLB: "#FF6F61", EPL: "#FFD166" };

/* team marks: logo when ESPN has one, otherwise a monogram in the team colour */
const teamIndex = new Map();
function indexTeams() {
  for (const [k, t] of Object.entries(state.teams || {})) teamIndex.set(k, { abbr: k.split("|")[1], ...t });
  for (const g of games()) for (const s of ["home", "away"]) teamIndex.set(`${g.sport}|${g[s].abbr}`, g[s]);
}
function teamColor(t, fallback = "#5E6A86") { const c = (t?.color || "").replace("#", ""); return /^[0-9a-f]{6}$/i.test(c) ? "#" + c : fallback; }
/** Team colour readable on the dark canvas (very dark brand colours fall back to their alternate). */
function liveColor(t) {
  for (const raw of [t?.color, t?.alt]) { const c = (raw || "").replace("#", ""); if (!/^[0-9a-f]{6}$/i.test(c)) continue;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16)), L = 0.2126 * r + 0.7152 * g + 0.0722 * b; if (L > 70 && L < 225) return "#" + c; }
  return "#8C98B4";
}
function mark(t, sport, big) {
  const full = t?.logo ? t : teamIndex.get(`${sport}|${t?.abbr}`) || t;
  if (full?.logo) return `<img class="tlogo ${big ? "big" : ""}" src="${esc(full.logo)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'tmono${big ? " big" : ""}',textContent:'${esc((full.abbr || "").slice(0, 4))}',style:'background:${teamColor(full)}'}))">`;
  return `<span class="tmono ${big ? "big" : ""}" style="background:${teamColor(full)}">${esc((full?.abbr || "?").slice(0, 4))}</span>`;
}

/* ------------------------------ data ------------------------------ */
const DATA_URL = "https://raw.githubusercontent.com/th4r6xkgcs-ui/edgebot/data/app.json";
async function connect() {
  const load = async () => {
    try {
      let r = await fetch(DATA_URL + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      if (!r.ok) r = await fetch("data/app.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("The first update hasn’t finished yet. Check back in a few minutes.");
      const d = await r.json();
      state.slate = d.slate; state.model = d.model; state.ledger = d.ledger || []; state.runs = d.runs || []; state.teams = d.teams || {}; state.error = "";
      simCache.clear(); indexTeams(); render(); if (hq.ready) hq.update();
    } catch (e) { state.error = navigator.onLine === false ? "You’re offline — showing the last loaded picks." : e.message; if (!state.slate) render(); }
  };
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
const games = () => (state.slate?.games || []);
const simCache = new Map();
function sim(g) {
  const p = g.pred; if (!p) return null;
  const k = g.id + "|" + p.margin + "|" + p.total + "|" + g.spread + "|" + g.total;
  if (!simCache.has(k)) simCache.set(k, E.simulate(g, { ...p }, 10000));
  return simCache.get(k);
}
function currentPicks() {
  const now = Date.now();
  return games().filter((g) => g.pick && Date.parse(g.start) > now - 3 * 3600e3)
    .map((g) => ({ g, p: g.pick, id: `${g.id}~${g.pick.market}~${g.pick.side}` }))
    .sort((a, b) => b.p.ev - a.p.ev);
}
const pickedTeam = (g, p) => p.side === "home" ? "home" : p.side === "away" ? "away" : null;
function topReason(g) {
  const w = g.why || [], sit = w.find((x) => /more days of rest|wind|back-to-back/i.test(x)); if (sit) return sit;
  const p = g.pred, pk = g.pick; if (!p || !pk) return "";
  const side = (m) => Math.abs(m) < 0.25 ? "even" : `${m > 0 ? g.home.abbr : g.away.abbr} by ${Math.abs(m).toFixed(1)}`;
  if (pk.market === "total") return `Market total ${g.total} · EdgeBot projects ${p.total.toFixed(1)} (ratings ${p.ratingT.toFixed(1)})`;
  return p.marketM != null ? `Market: ${side(p.marketM)} · EdgeBot ratings: ${side(p.ratingM)} (${p.nA}+${p.nH} games)` : `EdgeBot ratings: ${side(p.ratingM)}`;
}
function contextChips(g) {
  const c = [];
  if (g.restDays && g.restDays.home != null && g.restDays.away != null) c.push(`🛌 Rest ${g.away.abbr} ${g.restDays.away}d · ${g.home.abbr} ${g.restDays.home}d`);
  if (g.weather) c.push(g.weather.outdoor ? `🌬 ${Math.round(g.weather.windMph ?? 0)} mph wind${g.weather.tempF != null ? ` · ${Math.round(g.weather.tempF)}°F` : ""}${g.weather.rainPct ? ` · ${g.weather.rainPct}% rain` : ""}` : `🏟 ${g.weather.roof === "dome" ? "Dome" : "Roof closed"}`);
  const n = (x) => (x || []).filter((p) => p.status === "OUT" || p.status === "DOUBTFUL").length;
  if (g.injuries && n(g.injuries.away) + n(g.injuries.home)) c.push(`🩹 Out/doubtful ${g.away.abbr} ${n(g.injuries.away)} · ${g.home.abbr} ${n(g.injuries.home)}`);
  if (g.venue) c.push(`📍 ${g.venue}`);
  if (g.tv) c.push(`📺 ${g.tv}`);
  return c;
}

/* ------------------------------ line movement ------------------------------ */
const implied = (ml) => ml == null ? null : 1 / E.toDec(ml);
function lineMove(g, market) {
  const H = g.lineHist; if (!H || H.length < 2) return null;
  const a = H[0], b = H[H.length - 1];
  if ((market === "spread" || !market) && a.sp != null && b.sp != null && a.sp !== b.sp) return { kind: "spread", from: a.sp, to: b.sp, text: `${g.home.abbr} ${a.sp > 0 ? "+" : ""}${a.sp} → ${b.sp > 0 ? "+" : ""}${b.sp}` };
  if (market === "total" && a.tot != null && b.tot != null && a.tot !== b.tot) return { kind: "total", from: a.tot, to: b.tot, text: `O/U ${a.tot} → ${b.tot}` };
  if ((market === "moneyline" || !market) && a.mh != null && b.mh != null && a.mh !== b.mh) return { kind: "ml", from: a.mh, to: b.mh, text: `${g.home.abbr} ${am(a.mh)} → ${am(b.mh)}` };
  return null;
}
/** Did the line move toward EdgeBot's pick (good sign) or away from it? */
function moveDirection(g, p) {
  const m = lineMove(g, p.market); if (!m) return null;
  let toward = null;
  if (m.kind === "spread") toward = p.side === "home" ? m.to < m.from : m.to > m.from;           // market now likes our side more
  if (m.kind === "total") toward = p.side === "over" ? m.to > m.from : m.to < m.from;
  if (m.kind === "ml") { const d = implied(m.to) - implied(m.from); toward = p.side === "home" ? d > 0 : d < 0; }
  return { ...m, toward };
}

/* ------------------------------ the crowd ------------------------------ */
const money = (v) => v == null ? "—" : v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + Math.round(v);
/** Sportsbook (no-vig moneyline) home-win chance, for crowd-vs-books comparisons. */
function bookHome(g) { if (g.mlHome == null || g.mlAway == null) return null; const h = implied(g.mlHome), a = implied(g.mlAway), d = g.mlDraw != null ? implied(g.mlDraw) : 0; return h / (h + a + d); }
function crowdVsBooks(g) {
  const c = g.crowd, b = bookHome(g); if (!c || c.pHome == null || b == null) return null;
  const diff = c.pHome - b; if (Math.abs(diff) < 0.03) return null;
  return { team: diff > 0 ? g.home : g.away, pts: Math.abs(diff) };
}
function crowdChip(g, p) {
  const c = g.crowd; if (!c || c.pHome == null) return "";
  const side = pickedTeam(g, p); if (!side) return `<span class="move" style="background:rgba(143,128,255,.1);border-color:rgba(143,128,255,.3);color:#C4BBFF">👥 ${money(c.money)} traded on this game</span>`;
  const cp = side === "home" ? c.pHome : 1 - c.pHome - (c.pDraw || 0), agree = cp >= p.pMkt;
  return `<span class="move ${agree ? "with" : ""}" style="${agree ? "" : "background:rgba(143,128,255,.1);border-color:rgba(143,128,255,.3);color:#C4BBFF"}">👥 Crowd ${pct(cp)} on ${esc(g[side].abbr)} · ${money(c.money)} traded</span>`;
}

/* ------------------------------ pieces ------------------------------ */
function ring(p, pMkt, color) {
  const R = 32, C = 2 * Math.PI * R, a = Math.max(0, Math.min(1, p)), m = Math.max(0, Math.min(1, pMkt));
  const tick = (() => { const ang = m * 2 * Math.PI; return `<line x1="${38 + 26 * Math.cos(ang)}" y1="${38 + 26 * Math.sin(ang)}" x2="${38 + 38 * Math.cos(ang)}" y2="${38 + 38 * Math.sin(ang)}" stroke="#EEF1F8" stroke-width="2" stroke-linecap="round"/>`; })();
  return `<div class="ring" role="img" aria-label="EdgeBot ${pct(p)}, market ${pct(pMkt)}"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${R}" fill="none" stroke="#17213A" stroke-width="7"/><circle cx="38" cy="38" r="${R}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(a * C).toFixed(1)} ${C.toFixed(1)}"/>${tick}</svg><div class="v"><div><b>${pct(p)}</b><small>vs ${pct(pMkt)}</small></div></div></div>`;
}
function teamLine(t, sport, on, rank) {
  return `<div class="team ${on ? "on" : ""}">${mark(t, sport)}<span>${rank ? `<small class="num" style="color:var(--dim)">#${rank}</small> ` : ""}${esc(t.short || t.name)}</span>${t.record ? `<em>${esc(t.record)}</em>` : ""}</div>`;
}
function pickCard({ g, p, id }, feat) {
  const saved = state.saved.includes(id), side = pickedTeam(g, p), tc = side ? liveColor(g[side]) : "var(--amber)";
  const ringColor = p.tier === "Strong" ? "#45E0AE" : p.tier === "Value" ? "#FFB547" : "#B9C3DA";
  const why = topReason(g);
  return `<article class="card pick ${feat ? "feat" : ""}" style="--tc:${tc}">
    <div class="pick-top"><span class="badge"><i style="background:${SPORT_DOT[g.sport]}"></i>${esc(g.sport === "NCAAF" ? "CFB" : g.sport === "EPL" ? "EPL" : g.sport)} · ${esc(when(g.start))}</span>
      <span style="display:flex;align-items:center;gap:6px"><span class="tier t-${p.tier}">${p.tier}</span><button class="star" data-save="${esc(id)}" aria-pressed="${saved}" aria-label="${saved ? "Unsave" : "Save"} pick">${saved ? "★" : "☆"}</button></span></div>
    <button class="pick-main" data-game="${esc(g.id)}">
      <div class="pick-head"><strong>${esc(p.label)}<span class="num">${am(p.price)}</span></strong>
        <div class="teams">${teamLine(g.away, g.sport, side === "away", g.rank?.away)}${teamLine(g.home, g.sport, side === "home", g.rank?.home)}</div></div>
      ${ring(p.p, p.pMkt, ringColor)}
    </button>
    ${why ? `<p class="reason">${esc(why)}</p>` : ""}
    ${crowdChip(g, p)}
    ${(() => { const m = moveDirection(g, p); return m ? `<span class="move ${m.toward ? "with" : "against"}" title="Line movement since EdgeBot first saw it">${m.toward ? "▲" : "▼"} ${esc(m.text)} · ${m.toward ? "moving our way" : "moving against"}</span>` : ""; })()}
    <div class="stats"><div><span>Edge</span><b class="good">${sgn(p.edge * 100)}%</b></div><div><span>EV</span><b>${sgn(p.ev * 100)}%</b></div><div><span>Fair</span><b>${am(p.fair)}</b></div><div><span>Stake</span><b>${(p.stake ?? 0.25).toFixed(2).replace(/0$/, "")}u</b></div></div>
  </article>`;
}
function winBar(g, aP, hP, dP = 0) {
  const ca = liveColor(g.away), ch = liveColor(g.home);
  return `<div class="bar2"><i style="width:${(aP * 100).toFixed(1)}%;background:${ca}"></i>${dP ? `<i style="width:${(dP * 100).toFixed(1)}%;background:#3A4766"></i>` : ""}<i style="width:${(hP * 100).toFixed(1)}%;background:${ch}"></i></div>`;
}
function gameRow(g) {
  const p = g.pred, fin = g.status === "post", live = g.status === "in";
  const line = g.spread != null ? `${g.spread < 0 ? g.home.abbr : g.away.abbr} −${Math.abs(g.spread)}` : g.mlHome != null ? `ML ${am(g.mlAway)} / ${am(g.mlHome)}` : "No line yet";
  const right = live ? `<div class="wp" style="align-items:flex-end"><span class="livebadge">LIVE</span><span style="color:var(--muted);font-weight:500">${esc(g.detail || "")}</span></div>` : fin ? `<div class="wp" style="align-items:flex-end;color:var(--muted)">Final</div>`
    : p ? `<div class="wp"><div class="lbl"><span>${pct(p.pAway)}</span><span>${pct(p.pHome)}</span></div>${winBar(g, p.pAway, p.pHome, p.pDraw)}</div>` : `<div class="wp" style="align-items:flex-end">—</div>`;
  const sc = (side) => fin || live ? `<b class="sc">${g[side].score ?? 0}</b>` : "";
  return `<button class="game" data-game="${esc(g.id)}"><span class="side">
      <span class="team ${fin && g.away.score > g.home.score ? "on" : ""}" style="color:var(--fg)">${mark(g.away, g.sport)}<span>${esc(g.away.short || g.away.name)}</span>${sc("away")}</span>
      <span class="team ${fin && g.home.score > g.away.score ? "on" : ""}" style="color:var(--fg)">${mark(g.home, g.sport)}<span>${esc(g.home.short || g.home.name)}</span>${sc("home")}</span>
      <span class="meta2"><span>${esc(timeOf(g.start))} · ${esc(g.sport === "NCAAF" ? "CFB" : g.sport)}</span>${fin ? "" : `<span>${esc(line)}${g.total != null ? ` · O/U ${g.total}` : ""}</span>`}${g.pick ? `<span class="tier t-${g.pick.tier}">${esc(g.pick.label)}</span>` : ""}</span>
    </span>${right}</button>`;
}
function sportChips(list, key = "sport") {
  const counts = {}; for (const x of list) counts[x] = (counts[x] || 0) + 1;
  const sports = Object.keys(SP).filter((s) => counts[s]);
  return `<div class="chips" role="group" aria-label="Sport">${["ALL", ...sports, ...(key === "sport" ? ["SAVED"] : [])].map((s) =>
    `<button class="chip" data-${key}="${s}" aria-pressed="${state.sport === s}">${s !== "ALL" && s !== "SAVED" ? `<i style="width:7px;height:7px;border-radius:50%;background:${SPORT_DOT[s]}"></i>` : ""}${s === "ALL" ? "All" : s === "SAVED" ? "★ Saved" : sportLabel(s)}${s !== "ALL" && s !== "SAVED" ? `<b>${counts[s]}</b>` : ""}</button>`).join("")}</div>`;
}
function record() {
  const g = state.ledger.filter((r) => r.status === "graded"), dec = g.filter((r) => r.result !== "P"), w = dec.filter((r) => r.result === "W").length;
  return { g, dec, w, l: dec.length - w, units: g.reduce((a, r) => a + (r.units || 0), 0) };
}

/* ------------------------------ views ------------------------------ */
function viewPicks() {
  if (!state.slate) return loadingOrError();
  let picks = currentPicks();
