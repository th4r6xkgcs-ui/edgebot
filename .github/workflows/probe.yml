name: Probe data sources
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard"; do
            h=$(curl -sI -H "Origin: https://th4r6xkgcs-ui.github.io" "$u" | tr -d '\r' | grep -i "access-control-allow-origin" || echo "NO CORS HEADER")
            echo "::notice::$u -> $h"
          done
