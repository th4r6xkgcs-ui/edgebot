name: Data load check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git fetch --depth 1 origin data; echo "::notice::fetch exit $?"
          git branch -a | sed 's/^/::notice::branch /'
          git --work-tree=data checkout origin/data -- . ; echo "::notice::checkout origin/data exit $?"
          git --work-tree=data2 checkout FETCH_HEAD -- . ; echo "::notice::checkout FETCH_HEAD exit $?"
          echo "::notice::data has $(ls data 2>/dev/null | wc -l) entries; data2 has $(ls data2 2>/dev/null | wc -l)"
          git config --get-all remote.origin.fetch | sed 's/^/::notice::refspec /'
