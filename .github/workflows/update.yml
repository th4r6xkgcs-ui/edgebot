name: EdgeBot update
# GitHub runs scheduled jobs best-effort (on free repos often only every 3-5 hours), so each run stays alive and
# updates every 20 minutes for ~5.5 hours, then queues the next run. The schedule below is only a backup that
# restarts the chain if it ever stops. The concurrency group guarantees a single updater at a time.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "How long this run keeps updating (minutes)"
        default: "330"
permissions:
  contents: write
  actions: write
concurrency:
  group: edgebot-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      INTERVAL_MIN: 20
      LOOP_MIN: ${{ inputs.loop_minutes || '330' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unlock EdgeBot's code (encrypted in core/)
        env:
          CORE_KEY: ${{ secrets.CORE_KEY }}
        run: bash core/unseal.sh
      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "edgebot-bot"; git config user.email "edgebot-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep EdgeBot's schedule active" && git push
          fi
      - name: Load saved state (data branch)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            # saved state exists: it MUST load, or the run stops (never silently start over)
            git fetch --depth 1 origin data && git --work-tree=data checkout origin/data -- . || { echo "::error::Saved state exists but could not be loaded — stopping so nothing is overwritten."; exit 1; }
            [ -s data/state/model.json ] && [ -d data/state/archive ] || { echo "::error::Saved state looks incomplete — stopping so nothing is overwritten."; exit 1; }
            echo "::notice::Loaded saved state: $(ls data/state/archive | wc -l) archives, $(stat -c %s data/state/players/NBA.json 2>/dev/null || echo 0) bytes of NBA box scores"
          else echo "No data branch yet — starting fresh."; fi
      - name: Update loop (fetch, learn, pick, grade, save — every 20 minutes)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          CORE_KEY: ${{ secrets.CORE_KEY }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          [ -f PAUSE ] && { echo "::notice::Updater paused (PAUSE file in repo)."; exit 0; }
          start=$(date +%s); ok=0; bad=0; n=0
          while :; do
            n=$((n+1)); t0=$(date +%s)
            git fetch -q --depth 1 origin main && git cat-file -e origin/main:PAUSE 2>/dev/null && { echo "::notice::Paused mid-run; stopping without saving."; break; }
            # pick up code changes pushed while this loop is running
            git fetch -q --depth 1 origin main && git checkout -q origin/main -- core && bash core/unseal.sh > /dev/null || echo "::warning::cycle $n: kept the previous code (unlock failed)"
            if timeout 15m node scripts/update.mjs; then
              ok=$((ok+1))
              ( cd data && rm -rf .git && git init -q -b data && git config user.name "edgebot-bot" && git config user.email "edgebot-bot@users.noreply.github.com" \
                && git add -A && git commit -qm "EdgeBot data $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "$PUSH_URL" data:data ) \
                || { echo "::warning::cycle $n: saving state failed"; bad=$((bad+1)); }
            else
              bad=$((bad+1)); echo "::warning::cycle $n FAILED (see log); state from this cycle was not saved"
            fi
            now=$(date +%s)
            [ $(( now - start + INTERVAL_MIN * 60 )) -gt $(( LOOP_MIN * 60 )) ] && break
            wait=$(( INTERVAL_MIN * 60 - (now - t0) )); [ $wait -gt 0 ] && sleep $wait
          done
          echo "::notice::EdgeBot loop finished: $ok cycles ok, $bad failed"
          [ $ok -gt 0 ] || [ -f PAUSE ] || git cat-file -e origin/main:PAUSE 2>/dev/null
      - name: Queue the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main && git cat-file -e origin/main:PAUSE 2>/dev/null && echo "paused - not queuing" || gh api -X POST repos/${{ github.repository }}/actions/workflows/update.yml/dispatches -f ref=main || echo "::warning::could not queue next run; the backup schedule will restart it"
