name: EdgeBot update
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (GitHub runs scheduled jobs best-effort, so asking twice an hour keeps it close to hourly)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: edgebot-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "edgebot-bot"; git config user.email "edgebot-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep EdgeBot's schedule active" && git push
          fi
      - name: Load saved state (data branch)
        run: |
          git fetch --depth 1 origin data && git --work-tree=data checkout origin/data -- . || echo "No data branch yet — starting from the seed in data/."
      - name: Fetch games, learn, pick, grade
        run: node scripts/update.mjs
      - name: Save state (single commit, overwritten each run so history stays small)
        run: |
          cd data
          git init -q -b data
          git config user.name "edgebot-bot"
          git config user.email "edgebot-bot@users.noreply.github.com"
          git add -A && git commit -qm "EdgeBot data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
