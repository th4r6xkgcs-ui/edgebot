name: Deploy premium gate
# Deploys worker/gate.js to Cloudflare once the owner has added the repo secrets CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and WHOP_API_KEY. Secrets go to Cloudflare through stdin and are never printed.
on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/gate.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_KEY || secrets.CF_TOKEN || secrets.CLOUDFLARE || secrets.CLOUDFLARE_API }}
      CF_NAME: ${{ secrets.CLOUDFLARE_API_TOKEN && 'CLOUDFLARE_API_TOKEN' || secrets.CLOUDFARE_API_TOKEN && 'CLOUDFARE_API_TOKEN' || secrets.CLOUDFLARE_TOKEN && 'CLOUDFLARE_TOKEN' || secrets.CF_API_TOKEN && 'CF_API_TOKEN' || secrets.CLOUDFLARE_API_KEY && 'CLOUDFLARE_API_KEY' || secrets.CF_TOKEN && 'CF_TOKEN' || secrets.CLOUDFLARE && 'CLOUDFLARE' || secrets.CLOUDFLARE_API && 'CLOUDFLARE_API' || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
      WHOP_CLIENT_SECRET: ${{ secrets.WHOP_CLIENT_SECRET }}
      V_CF: ${{ vars.CLOUDFLARE_API_TOKEN != '' && 'yes' || '' }}
      V_WHOP: ${{ vars.WHOP_API_KEY != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unlock EdgeBot's code
        env:
          CORE_KEY: ${{ secrets.CORE_KEY }}
        run: bash core/unseal.sh
      - name: Check secrets
        id: chk
        run: |
          # tolerate a pasted "WHOP_API_KEY=..." line, quotes or spaces around the key
          clean=$(printf %s "$WHOP_API_KEY" | grep -oE 'apik_[A-Za-z0-9_-]+' | head -1); [ -n "$clean" ] || clean=$(printf %s "$WHOP_API_KEY" | head -1 | sed -E 's/^[[:space:]]*(export[[:space:]]+)?WHOP_API_KEY[[:space:]]*[=:][[:space:]]*//; s/^["'"'"']//; s/["'"'"'][[:space:]]*$//; s/[[:space:]]+$//')
          echo "::notice::Whop secret has $(printf %s "$WHOP_API_KEY" | grep -c '') line(s); using the apik_ key from it"
          echo "::add-mask::$clean"; echo "CLEAN_WHOP=$clean" >> "$GITHUB_ENV"; WHOP_API_KEY=$clean
          # report presence only (never values)
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "::notice::Cloudflare token secret: found (named $CF_NAME)" || echo "::warning::CLOUDFLARE_API_TOKEN secret: missing${V_CF:+ (it was added as a Variable, not a Secret)}"
          [ -n "$WHOP_API_KEY" ] && echo "::notice::WHOP_API_KEY secret: found" || echo "::warning::WHOP_API_KEY secret: missing${V_WHOP:+ (it was added as a Variable, not a Secret)}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$WHOP_API_KEY" ]; then
            echo "::notice::Premium gate not deployed yet: add CLOUDFLARE_API_TOKEN and WHOP_API_KEY as repository secrets."
            echo "ready=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then # look it up from the token (works when the token covers one account)
            id=$(printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" | curl -s -H @- "https://api.cloudflare.com/client/v4/accounts?per_page=5" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).result||[];process.stdout.write(r.length?r[0].id:"")}catch{}})')
            if [ -z "$id" ]; then echo "::error::Couldn't find the Cloudflare account from the token. Add CLOUDFLARE_ACCOUNT_ID as a secret."; exit 1; fi
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - name: Deploy worker
        if: steps.chk.outputs.ready == 'yes'
        run: |
          # phone alerts: a KV store for subscriptions + a 15-minute job. If the token can't make the store, deploy without alerts.
          ns=$(npx --yes wrangler@4 kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>/edgebot-push$/.test(x.title));process.stdout.write(n?n.id:"")}catch{}})')
          if [ -z "$ns" ]; then npx --yes wrangler@4 kv namespace create edgebot-push > kv.log 2>&1; ns=$(grep -oE '[0-9a-f]{32}' kv.log | head -1); fi
          printf 'name = "edgebot-gate"\nmain = "worker/gate.js"\ncompatibility_date = "2026-10-01"\n' > wrangler.toml
          if [ -n "$ns" ]; then printf '[[kv_namespaces]]\nbinding = "PUSH"\nid = "%s"\n[triggers]\ncrons = ["*/15 * * * *"]\n' "$ns" >> wrangler.toml; echo "::notice::Phone alerts: storage ready, 15-minute job on"
          else echo "::warning::Phone alerts: couldn't create storage (the Cloudflare token needs 'Workers KV Storage: Edit'). Deploying without phone alerts."; tail -3 kv.log 2>/dev/null | sed 's/^/::warning::/'; fi
          npx --yes wrangler@4 deploy > deploy.log 2>&1 || { tail -20 deploy.log | sed 's/^/::error::/'; exit 1; }
          printf %s "$CLEAN_WHOP" | npx --yes wrangler@4 secret put WHOP_API_KEY --name edgebot-gate > secret.log 2>&1 || { tail -5 secret.log | sed 's/^/::error::/'; exit 1; }
          cs=$(printf %s "$WHOP_CLIENT_SECRET" | tr -d '[:space:]' | sed -E 's/^WHOP_CLIENT_SECRET=//')
          [ -n "$cs" ] && { [ "$cs" = "$CLEAN_WHOP" ] && echo "::warning::WHOP_CLIENT_SECRET is the SAME as the Whop API key — paste the OAuth Client secret instead." ; case "$cs" in apik_*) echo "::warning::WHOP_CLIENT_SECRET starts with apik_ (that's an API key, not the OAuth client secret).";; esac; }
          if [ -n "$cs" ]; then printf %s "$cs" | npx --yes wrangler@4 secret put WHOP_CLIENT_SECRET --name edgebot-gate > secret2.log 2>&1 && echo "::notice::WHOP_CLIENT_SECRET: set on the gate (length ${#cs})" || { tail -5 secret2.log | sed 's/^/::error::/'; exit 1; }
          else echo "::warning::WHOP_CLIENT_SECRET secret missing: Whop sign-in can't finish until it's added."; fi
          url=$(grep -oE 'https://edgebot-gate\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Deployed, but no workers.dev URL found. In Cloudflare, open Workers & Pages once to pick a workers.dev subdomain, then re-run."; exit 1; fi
          echo "::notice::Premium gate live at $url"
          sleep 5
          echo "::notice::Gate health: $(curl -s -m 15 "$url/" | head -c 120)"
          echo "::notice::Phone alerts key: $(curl -s -m 15 -H 'Origin: https://edgebot-612.pages.dev' "$url/push/key" | head -c 40)… (a key = ready)"
          tk=$(curl -s -m 15 -X POST -H 'Content-Type: application/json' -H 'Origin: https://edgebot-612.pages.dev' -d '{"grant_type":"authorization_code","code":"edgebot-selftest","client_id":"app_j8biqb1wkqFnCR","redirect_uri":"https://edgebot-612.pages.dev/","code_verifier":"x"}' "$url/token" | head -c 200)
          echo "::notice::Sign-in self-test (a fake code should be refused as an invalid code/grant, NOT as a bad client or missing secret): $tk"
          echo "::notice::Gate data health (from the app's origin): $(curl -s -m 20 -H 'Origin: https://edgebot-612.pages.dev' "$url/health" | head -c 220)"
          echo "::notice::Owner-token preflight: $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://edgebot-612.pages.dev' -H 'Access-Control-Request-Headers: x-owner-token' "$url/premium") · wrong owner token → HTTP $(curl -s -o /dev/null -w '%{http_code}' -H 'X-Owner-Token: wrong' "$url/premium") (401 expected)"
          echo "::notice::Gate without sign-in returns HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 15 "$url/premium") (401 expected)"
          code=$(printf 'Authorization: Bearer %s\n' "$CLEAN_WHOP" | curl -s -o whop.json -w '%{http_code}' -m 15 -H @- "https://api.whop.com/api/v1/accounts/me")
          biz=$(grep -oE '"biz_[A-Za-z0-9]+"' whop.json | head -1); rm -f whop.json
          code2=$(printf 'Authorization: Bearer %s\n' "$CLEAN_WHOP" | curl -s -o acc.json -w '%{http_code}' -m 15 -H @- "https://api.whop.com/api/v1/users/user_0000000000000/access/prod_uShPEUv6jPHbc")
          echo "::notice::Whop membership-check permission: HTTP $code2 $(head -c 160 acc.json | tr -d '\n') (403 = key lacks permission; 404/400/200 = OK)"; rm -f acc.json
          echo "::notice::Whop API key check (accounts/me): HTTP $code ${biz:+account $biz} (200 = key works). Key looks like: ${CLEAN_WHOP:0:4}… length ${#CLEAN_WHOP}"
          printf '{"gate":"%s"}\n' "$url" > config.json
          if ! git diff --quiet -- config.json 2>/dev/null || [ -n "$(git status --porcelain config.json)" ]; then
            git config user.name "edgebot-bot"; git config user.email "edgebot-bot@users.noreply.github.com"
            git add config.json && git commit -qm "Premium gate URL" && git push
          fi
