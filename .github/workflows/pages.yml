name: Deploy site (Cloudflare Pages)
# Builds the minified site and publishes it to Cloudflare Pages. Secrets go to tools via environment/stdin only.
on:
  push:
    branches: [main]
    paths: ["core/**", "manifest.json", "icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unlock EdgeBot's code
        env:
          CORE_KEY: ${{ secrets.CORE_KEY }}
        run: bash core/unseal.sh
      - name: Build (minified)
        run: npm i --no-save --silent terser@5 && node scripts/build-site.mjs
      - name: Account
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            id=$(printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" | curl -s -H @- "https://api.cloudflare.com/client/v4/accounts?per_page=5" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).result||[];process.stdout.write(r.length?r[0].id:"")}catch{}})')
            [ -n "$id" ] || { echo "::error::Couldn't find the Cloudflare account."; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          fi
      - name: Create project (first time) and deploy
        run: |
          npx --yes wrangler@4 pages project create edgebot --production-branch main > create.log 2>&1 || grep -qi "already exists\|8000002" create.log || { tail -8 create.log | sed 's/^/::warning::create: /'; }
          npx --yes wrangler@4 pages deploy dist --project-name edgebot --branch main --commit-dirty=true > deploy.log 2>&1 || { tail -15 deploy.log | sed 's/^/::error::/'; exit 1; }
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          sub=$(printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" | curl -s -H @- "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/edgebot" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||"")}catch{}})')
          echo "::notice::Site deployed: $url"
          echo "::notice::Production address: https://$sub"
          sleep 8
          for u in "https://$sub/" "https://$sub/engine.js" "https://$sub/manifest.json"; do echo "::notice::check $u → HTTP $(curl -s -o /tmp/x -w '%{http_code}' "$u") · $(wc -c < /tmp/x) bytes · $(grep -o '<title>[^<]*' /tmp/x | head -1)"; done
